<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
<title>Số phiên theo người</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<style>
text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #5D687A; }
.axis { font-size: 13px; fill: #5D687A; }
.label { font-size: 14px; font-weight: 600; }
.value { font-size: 13px; font-weight: 700; }
</style>
<text x="55.0" y="48.0" class="title" text-anchor="start">Số phiên đo thật theo người</text>
<text x="55.0" y="76.0" class="subtitle" text-anchor="start">Dữ liệu mất cân bằng: Tai có 4 phiên, mỗi người còn lại chỉ có 1 phiên.</text>
<line x1="110" y1="405.0" x2="870" y2="405.0" stroke="#D7DEE8"/>
<text x="96.0" y="410.0" class="axis" text-anchor="end">0</text>
<line x1="110" y1="330.0" x2="870" y2="330.0" stroke="#D7DEE8"/>
<text x="96.0" y="335.0" class="axis" text-anchor="end">1</text>
<line x1="110" y1="255.0" x2="870" y2="255.0" stroke="#D7DEE8"/>
<text x="96.0" y="260.0" class="axis" text-anchor="end">2</text>
<line x1="110" y1="180.0" x2="870" y2="180.0" stroke="#D7DEE8"/>
<text x="96.0" y="185.0" class="axis" text-anchor="end">3</text>
<line x1="110" y1="105.0" x2="870" y2="105.0" stroke="#D7DEE8"/>
<text x="96.0" y="110.0" class="axis" text-anchor="end">4</text>
<rect x="110.0" y="330.0" width="120" height="75.0" rx="8" fill="#0072B2"/>
<text x="170.0" y="318.0" class="value" text-anchor="middle">1</text>
<text x="170.0" y="435.0" class="label" text-anchor="middle">Dung</text>
<rect x="323.3333333333333" y="330.0" width="120" height="75.0" rx="8" fill="#009E73"/>
<text x="383.3" y="318.0" class="value" text-anchor="middle">1</text>
<text x="383.3" y="435.0" class="label" text-anchor="middle">Minh</text>
<rect x="536.6666666666666" y="330.0" width="120" height="75.0" rx="8" fill="#E69F00"/>
<text x="596.7" y="318.0" class="value" text-anchor="middle">1</text>
<text x="596.7" y="435.0" class="label" text-anchor="middle">Quy</text>
<rect x="750.0" y="105.0" width="120" height="300.0" rx="8" fill="#CC79A7"/>
<text x="810.0" y="93.0" class="value" text-anchor="middle">4</text>
<text x="810.0" y="435.0" class="label" text-anchor="middle">Tai</text>
</svg>